# ─────────────────────────────────────────────────────────────────────────────
# FoodFlow – Docker Compose
# Usage:
#   docker-compose up --build      # build & start
#   docker-compose up -d           # detached
#   docker-compose down            # stop & remove containers
#   docker-compose logs -f         # tail logs
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── nginx / static frontend ─────────────────────────────────────────────────
  foodflow:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: foodflow-web
    image: foodflow:latest
    ports:
      - "8080:80"           # Access at http://localhost:8080
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.foodflow.service=web"
      - "com.foodflow.version=1.0"

  # ── Express / Node API (optional – enable when API is ready) ────────────────
  # Uncomment this block to run the Node server alongside nginx
  #
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: builder
  #   container_name: foodflow-api
  #   command: node server.js
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3000
  #   env_file:
  #     - .env
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   restart: unless-stopped
  #   depends_on:
  #     - foodflow

networks:
  default:
    name: foodflow-net
    driver: bridge

volumes:
  # Placeholder for future persistent volumes (DB, uploads, etc.)
  foodflow_data:
    driver: local
