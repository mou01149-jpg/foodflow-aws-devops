version: 0.0
os: linux

# ============================================================
# FoodFlow – AWS CodeDeploy Application Specification
# Target: Amazon EC2 (Amazon Linux 2 / Amazon Linux 2023)
# Web Server: Apache httpd
# Deploy Path: /var/www/html/
# ============================================================

files:
  # Copy all HTML pages to Apache root
  - source: index.html
    destination: /var/www/html/
  - source: menu.html
    destination: /var/www/html/
  - source: cart.html
    destination: /var/www/html/
  - source: orders.html
    destination: /var/www/html/
  - source: about.html
    destination: /var/www/html/
  - source: contact.html
    destination: /var/www/html/
  # Copy CSS and JavaScript
  - source: style.css
    destination: /var/www/html/
  - source: script.js
    destination: /var/www/html/
  # Copy build info
  - source: build-info.txt
    destination: /var/www/html/
  # Copy deployment scripts
  - source: scripts
    destination: /home/ec2-user/foodflow-scripts/

permissions:
  - object: /var/www/html/
    pattern: "**"
    owner: apache
    group: apache
    mode: 644
    type:
      - file
  - object: /var/www/html/
    pattern: "**"
    owner: apache
    group: apache
    mode: 755
    type:
      - directory
  - object: /home/ec2-user/foodflow-scripts/
    pattern: "**/*.sh"
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 30
      runas: root

  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 30
      runas: root
